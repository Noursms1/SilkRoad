<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilkRoad for Pi</title>
    <meta name="description" content="SilkRoad Pi Ecosystem Integration">
    <meta property="og:url" content="/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="SilkRoad for Pi">
    <meta property="og:description" content="Pi Network Ecosystem Application">
    <meta property="og:image" content="logo.png">
    <link rel="shortcut icon" href="logo.png">
    
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="colorbox/example3/colorbox.css">
    
    <!-- Enhanced Google Translate CSS -->
    <style>
        .goog-te-banner-frame.skiptranslate,
        .goog-te-gadget-simple { display: none !important; }
        body { top: 0 !important; position: static !important; }
        .goog-te-menu-frame { max-width: 100% !important; }
    </style>
    
    <!-- Latest Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk-latest.js"></script>
</head>

<body>
    <!-- Navigation -->
    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="#"><button class="btn btn-info w-100 mt-3">Store</button></a>
        <a href="#"><button class="btn btn-info w-100 mt-3">Facebook Group</button></a>
        <a href="#"><button class="btn btn-info w-100 mt-3">Watch TV</button></a>
        <a href="#"><button class="btn btn-info w-100 mt-3">Donate</button></a>
    </div>

    <!-- Main Content -->
    <div class="container mt-5">
        <nav class="navbar navbar-light bg-light sticky-top">
            <button class="navbar-toggler" onclick="openNav()">&#9776;</button>
            <div id="google_translate_element"></div>
        </nav>

        <div class="text-center mt-5">
            <h1>SilkRoad Pi Ecosystem</h1>
            <button id="ver_pi_ads" class="btn btn-primary mt-3">Watch Pi Ads</button>
            
            <div class="input-group mt-3">
                <input id="pi_donate" type="number" class="form-control" placeholder="Amount in Pi" min="0.01" max="100" step="0.01">
                <button id="button_click" class="btn btn-success">
                    <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                    Donate Pi
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="colorbox/jquery.colorbox.js"></script>
    
    <!-- Google Translate -->
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>

    <!-- Optimized Pi Integration -->
    <script>
        const Pi = window.Pi;
        Pi.init({ version: "2.0" });

        // Improved Nav Function
        function openNav() {
            const sidenav = document.getElementById("mySidenav");
            sidenav.style.width = "250px";
            setTimeout(() => sidenav.style.transition = "0.3s", 10);
        }

        // Enhanced Payment Security
        $('#button_click').click(async () => {
            const amount = parseFloat($('#pi_donate').val());
            if (isNaN(amount) || amount <= 0 || amount > 100) {
                alert('Please enter a valid amount (0.01-100 PI)');
                return;
            }
            
            $('.spinner-border').removeClass('d-none');
            $('#button_click').prop('disabled', true);
            
            try {
                const payment = Pi.createPayment({
                    amount: amount,
                    memo: "Donation to SilkRoad",
                    metadata: { type: "donation" }
                }, {
                    onReadyForServerApproval: async (paymentId) => {
                        await $.post('server1.php', {
                            action: 'approve',
                            paymentId: paymentId,
                            app_client: 'silkroad-mainnet'
                        });
                    },
                    onReadyForServerCompletion: async (paymentId, txid) => {
                        await $.post('server1.php', {
                            action: 'complete',
                            paymentId: paymentId,
                            txid: txid,
                            app_client: 'silkroad-mainnet'
                        });
                    }
                });
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                $('.spinner-border').addClass('d-none');
                $('#button_click').prop('disabled', false);
            }
        });

        // Improved Ads Handling
        async function showPiAds() {
            try {
                const isAdReady = await Pi.Ads.isAdReady("rewarded");
                if (!isAdReady.ready) {
                    const requestAd = await Pi.Ads.requestAd("rewarded");
                    if (requestAd.result === "ADS_NOT_SUPPORTED") {
                        return alert("Please update Pi Browser");
                    }
                    if (requestAd.result !== "AD_LOADED") {
                        return alert("Ads unavailable. Try later.");
                    }
                }
                
                const showAd = await Pi.Ads.showAd("rewarded");
                if (showAd.result === "AD_REWARDED") {
                    // Reward logic here
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
